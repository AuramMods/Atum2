plugins {
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

group = 'com.teammetallurgy.atum'
version = "${minecraft_version}-${mod_version}" + (System.getenv('BUILD_NUMBER') ? ".jenkins${System.getenv('BUILD_NUMBER')}" : '')

base {
    archivesName = 'Atum'
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            mods {
                atum { source sourceSets.main }
            }
        }
        client {
            workingDirectory project.file('run/client')
        }
        server {
            workingDirectory project.file('run/server')
            args '--nogui'
            jvmArg '-Djava.awt.headless=true'
        }
        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.enabledGameTestNamespaces', 'atum'
            jvmArg '-Djava.awt.headless=true'
        }
        data {
            workingDirectory project.file('run/data')
            args '--mod', 'atum', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets {
    migration {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('migrateLegacyWorld', JavaExec) {
    group = 'atum'
    description = 'Copy a Minecraft 1.16.5 Atum save for use with the Forge 1.20.1 port.'
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'com.teammetallurgy.atum.misc.migration.LegacyWorldMigration'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'com.blamejared.crafttweaker'
            includeGroup 'org.openzen.zencode'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-${minecraft_version}:${ct_version}")
    compileOnly fg.deobf("curse.maven:the-one-probe-245211:${top_file}")
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_file}")
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:${patchouli_file}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
}

tasks.named('jar', Jar).configure {
    manifest.attributes('Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}

def apiJar = tasks.register('apiJar', Jar) {
    from sourceSets.main.allSource
    from sourceSets.main.output
    include 'com/teammetallurgy/atum/api/**/*'
    archiveClassifier = 'api'
}

publishing {
    tasks.publish.dependsOn 'build'
    publications {
        mavenJava(MavenPublication) {
            artifactId "atum2_${minecraft_version}"
            artifact jar
            artifact apiJar
        }
    }
    repositories {
        if (project.hasProperty('maven_repo')) {
            maven { url maven_repo }
        } else {
            mavenLocal()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
